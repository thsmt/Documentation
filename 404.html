<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <base href="/Documentation/">
  <title>ページがありません | Documentation</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f5f7f9;
      --surface: #ffffff;
      --border: #cbd5df;
      --text: #202b38;
      --muted: #5b6877;
      --accent: #146aa3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111820;
        --surface: #19232e;
        --border: #394958;
        --text: #edf3f7;
        --muted: #b1bec9;
        --accent: #69b7e8;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(100%, 640px);
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    .status {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.65rem, 5vw, 2.25rem);
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-underline-offset: 3px;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="status">404 Not Found</p>
    <h1>ページがありません（404）</h1>
    <p>指定されたページは非公開、移動済み、または削除済み</p>
    <a href="/Documentation/">Documentationへ戻る</a>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
