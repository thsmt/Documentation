<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f6f9;
      --surface: rgba(255, 255, 255, 0.96);
      --surface-muted: #f7f8fa;
      --text: #1f2328;
      --muted: #656d76;
      --line: #d8dee4;
      --accent: #0969da;
      --accent-hover: #0757b9;
      --danger: #cf222e;
      --shadow: 0 22px 55px rgba(31, 35, 40, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1117;
        --surface: rgba(22, 27, 34, 0.97);
        --surface-muted: #161b22;
        --text: #e6edf3;
        --muted: #9da7b3;
        --line: #30363d;
        --accent: #58a6ff;
        --accent-hover: #79b8ff;
        --danger: #ff7b72;
        --shadow: 0 22px 55px rgba(0, 0, 0, 0.34);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(9, 105, 218, 0.10), transparent 32rem),
        var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.7;
    }

    button,
    input {
      font: inherit;
    }

    .lock-screen {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .unlock-card {
      width: min(100%, 430px);
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .lock-mark {
      display: grid;
      width: 46px;
      height: 46px;
      margin-bottom: 22px;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #111827;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.08em;
    }

    .kicker,
    .memo-label {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    .unlock-card h1 {
      margin-bottom: 8px;
      font-size: clamp(25px, 5vw, 31px);
      line-height: 1.25;
    }

    .description {
      margin-bottom: 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      margin-top: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      color: var(--text);
      background: var(--surface-muted);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .unlock-button {
      width: 100%;
      margin-top: 24px;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
    }

    .unlock-button:hover {
      background: var(--accent-hover);
    }

    .unlock-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status {
      min-height: 1.7em;
      margin: 14px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 650;
      text-align: center;
    }

    .protected-content {
      width: min(100% - 32px, 920px);
      margin: 48px auto;
    }

    .memo-card {
      padding: clamp(25px, 5vw, 54px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .memo-card h1 {
      margin-bottom: 12px;
      font-size: clamp(29px, 5vw, 45px);
      line-height: 1.2;
    }

    .memo-lead {
      margin-bottom: 34px;
      color: var(--muted);
      font-size: 17px;
    }

    .memo-card section {
      margin-top: 30px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .memo-card h2 {
      margin-bottom: 12px;
      font-size: 23px;
    }

    .memo-card li + li {
      margin-top: 7px;
    }

    pre {
      overflow-x: auto;
      margin: 18px 0 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-muted);
      line-height: 1.6;
    }

    code {
      font-family: "Cascadia Code", Consolas, monospace;
    }

    .terraform-notes h3 {
      margin: 24px 0 10px;
      font-size: 18px;
    }

    .terraform-notes table {
      width: 100%;
      margin: 18px 0;
      border-collapse: collapse;
      font-size: 14px;
    }

    .terraform-notes th,
    .terraform-notes td {
      padding: 11px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .terraform-notes th {
      background: var(--surface-muted);
      font-weight: 800;
    }

    .terraform-notes code:not(pre code) {
      padding: 0.12em 0.38em;
      border-radius: 5px;
      background: var(--surface-muted);
      overflow-wrap: anywhere;
    }

    .note-box,
    .warning-box {
      margin: 20px 0;
      padding: 17px 19px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    }

    .warning-box {
      border-color: color-mix(in srgb, #d97706 45%, var(--line));
      border-left-color: #d97706;
      background: color-mix(in srgb, #d97706 7%, var(--surface));
    }

    .note-box p,
    .warning-box p {
      margin: 7px 0 0;
    }

    .architecture-flow,
    .step-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin: 18px 0;
    }

    .architecture-flow span,
    .step-flow span {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-muted);
      font-weight: 750;
    }

    .architecture-flow b,
    .step-flow b {
      color: var(--accent);
      font-size: 13px;
    }

    .return-flow {
      color: var(--muted);
      font-size: 13px;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .symbol-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 76px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-muted);
    }

    .symbol-card > b {
      min-width: 40px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 25px;
      text-align: center;
    }

    .symbol-card.create > b { color: #1a7f37; }
    .symbol-card.destroy > b { color: #cf222e; }
    .symbol-card.update > b { color: #9a6700; }
    .symbol-card.replace > b { color: #8250df; }
    .symbol-card.read > b { color: var(--accent); }

    .timeline {
      padding-left: 1.7em;
      counter-reset: steps;
    }

    .timeline li {
      padding-left: 0.3em;
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .check-grid > div {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-muted);
    }

    .check-grid h3 {
      margin-top: 0;
    }

    .check-list li::marker {
      color: var(--accent);
    }

    .small,
    .source-list {
      color: var(--muted);
      font-size: 13px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 520px) {
      .unlock-card {
        padding: 28px 22px;
      }

      .protected-content {
        margin: 20px auto;
      }

      .check-grid {
        grid-template-columns: 1fr;
      }

      .terraform-notes th,
      .terraform-notes td {
        padding: 9px;
      }
    }
  </style>
</head>
<body>
  <main id="lock-screen" class="lock-screen">
    <section class="unlock-card" aria-labelledby="unlock-title">
      <div class="lock-mark" aria-hidden="true">••</div>
      <p class="kicker">Documentation</p>
      <h1 id="unlock-title">認証が必要</h1>
      <p class="description">暗号化されたページ</p>

      <form id="unlock-form" autocomplete="off">
        <div class="field">
          <label for="username">ユーザー名</label>
          <input id="username" name="username" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" required autocomplete="off">
        </div>

        <button id="unlock-button" class="unlock-button" type="submit">ページを開く</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <main id="protected-content" class="protected-content" hidden></main>

  <noscript>JavaScriptが必要</noscript>

    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const form = document.getElementById("unlock-form");
    const button = document.getElementById("unlock-button");
    const status = document.getElementById("status");
    const lockScreen = document.getElementById("lock-screen");
    const protectedContent = document.getElementById("protected-content");

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (character) => character.charCodeAt(0));
    }

    async function decryptPage(username, password) {
      const credential = `${username.normalize("NFKC")}\u0000${password.normalize("NFKC")}`;
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(credential),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          salt: fromBase64(encryptedPayload.salt),
          iterations: encryptedPayload.iterations
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const plaintext = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: fromBase64(encryptedPayload.iv)
        },
        key,
        fromBase64(encryptedPayload.ciphertext)
      );

      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      button.disabled = true;
      button.textContent = "確認中...";

      const username = form.elements.username.value;
      const password = form.elements.password.value;

      try {
        const pageHtml = await decryptPage(username, password);
        form.reset();
        protectedContent.innerHTML = pageHtml;
        lockScreen.hidden = true;
        protectedContent.hidden = false;
        document.title = "Documentation";
      } catch {
        form.elements.password.value = "";
        status.textContent = "認証情報が一致しない";
        form.elements.password.focus();
      } finally {
        button.disabled = false;
        button.textContent = "ページを開く";
      }
    });
