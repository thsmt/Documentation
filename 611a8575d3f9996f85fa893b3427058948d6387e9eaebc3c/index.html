<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="../assets/styles.css?v=20260823-ref1">
  <style>

    body {
      padding-top: 0;
    }

    body.unlocked {
      padding-top: 64px;
    }

    button,
    input {
      font: inherit;
    }

    .lock-screen {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 18%, rgba(88, 166, 255, 0.10), transparent 32rem),
        var(--bg);
    }

    .unlock-card {
      width: min(100%, 430px);
      padding: 36px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.28);
    }

    .lock-mark {
      display: grid;
      width: 42px;
      height: 42px;
      margin-bottom: 20px;
      place-items: center;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent-strong);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.08em;
    }

    .kicker {
      margin: 0 0 6px;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .unlock-card h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 5vw, 31px);
      line-height: 1.25;
    }

    .description {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      margin-top: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      padding: 12px 13px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.18);
    }

    .unlock-button {
      width: 100%;
      margin-top: 24px;
      padding: 12px 16px;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      cursor: pointer;
      font-weight: 800;
    }

    .unlock-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 1.7em;
      margin: 14px 0 0;
      color: var(--error-text);
      font-size: 13px;
      font-weight: 650;
      text-align: center;
    }

    .protected-content {
      width: 100%;
    }

    .private-layout {
      display: grid;
      grid-template-columns: minmax(0, 1000px) minmax(190px, 240px);
      gap: 36px;
      width: min(1320px, calc(100% - 48px));
      margin: 0 auto;
      padding: 56px 0 88px;
    }

    .protected-content .toc {
      display: block;
    }

    .terraform-guide > section > h2 {
      margin-top: 68px;
      padding-top: 30px;
      border-top: 1px solid var(--line);
    }

    .architecture-flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin: 18px 0;
    }

    .architecture-flow span {
      padding: 9px 12px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-weight: 700;
    }

    .architecture-flow b {
      color: var(--accent-strong);
      font-size: 13px;
    }

    .return-flow {
      color: var(--muted);
      font-size: 13px;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .symbol-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 76px;
      padding: 14px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .symbol-card > b {
      min-width: 42px;
      font-family: Consolas, "SFMono-Regular", Menlo, monospace;
      font-size: 24px;
      text-align: center;
    }

    .symbol-card.create > b { color: var(--success-text); }
    .symbol-card.destroy > b { color: var(--error-text); }
    .symbol-card.update > b { color: var(--warning-text); }
    .symbol-card.replace > b { color: #bc8cff; }
    .symbol-card.read > b { color: var(--accent-strong); }

    .example-panel > h3 {
      margin-top: 0;
    }

    .source-list {
      color: var(--muted);
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 900px) {
      .private-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .protected-content .toc {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .unlock-card {
        padding: 28px 22px;
      }

      .private-layout {
        width: min(100% - 32px, 1000px);
        padding-top: 30px;
      }

      .private-site-header .nav {
        display: none;
      }

      .architecture-flow b {
        width: 100%;
        text-align: center;
      }
    }
    </style>
</head>
<body>
  <main id="lock-screen" class="lock-screen">
    <section class="unlock-card" aria-labelledby="unlock-title">
      <div class="lock-mark" aria-hidden="true">••</div>
      <p class="kicker">Documentation</p>
      <h1 id="unlock-title">認証が必要</h1>
      <p class="description">暗号化されたページ</p>

      <form id="unlock-form" autocomplete="off">
        <div class="field">
          <label for="username">ユーザー名</label>
          <input id="username" name="username" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" required autocomplete="off">
        </div>

        <button id="unlock-button" class="unlock-button" type="submit">ページを開く</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <div id="protected-content" class="protected-content" hidden></div>

    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const form = document.getElementById("unlock-form");
    const button = document.getElementById("unlock-button");
    const status = document.getElementById("status");
    const lockScreen = document.getElementById("lock-screen");
    const protectedContent = document.getElementById("protected-content");

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (character) => character.charCodeAt(0));
    }

    async function decryptPage(username, password) {
      const credential = `${username.normalize("NFKC")}\u0000${password.normalize("NFKC")}`;
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(credential),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          salt: fromBase64(encryptedPayload.salt),
          iterations: encryptedPayload.iterations
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const plaintext = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: fromBase64(encryptedPayload.iv)
        },
        key,
        fromBase64(encryptedPayload.ciphertext)
      );

      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      button.disabled = true;
      button.textContent = "確認中...";

      const username = form.elements.username.value;
      const password = form.elements.password.value;

      try {
        const pageHtml = await decryptPage(username, password);
        form.reset();
        protectedContent.innerHTML = pageHtml;
        lockScreen.hidden = true;
        protectedContent.hidden = false;
        document.body.classList.add("unlocked");

        if (typeof enhancePageSummaries === "function") enhancePageSummaries();
        if (typeof addCodeLineNumbers === "function") addCodeLineNumbers();
        if (typeof highlightUserValues === "function") highlightUserValues();

        const themeButton = protectedContent.querySelector(".private-theme-toggle");
        const syncThemeButton = () => {
          if (!themeButton) return;
          const theme = document.documentElement.dataset.theme || "dark";
          themeButton.textContent = theme === "dark" ? "☀" : "☾";
          themeButton.setAttribute("aria-label", theme === "dark" ? "ライトモードに切り替え" : "ダークモードに切り替え");
          themeButton.setAttribute("title", theme === "dark" ? "ライトモードに切り替え" : "ダークモードに切り替え");
        };
        themeButton?.addEventListener("click", () => {
          const current = document.documentElement.dataset.theme || "dark";
          const next = current === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          localStorage.setItem("knowledge-theme", next);
          syncThemeButton();
        });
        syncThemeButton();

        window.scrollTo({ top: 0, behavior: "instant" });
        document.title = "Documentation";
      } catch {
        form.elements.password.value = "";
        status.textContent = "認証情報が一致しない";
        form.elements.password.focus();
      } finally {
        button.disabled = false;
        button.textContent = "ページを開く";
      }
    });
  </script>
